name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --only-binary :all: uv==0.10.1

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Generate coverage report
        run: uv run --frozen --no-build coverage run -m pytest --junitxml=test-results.xml && uv run --frozen --no-build coverage xml -o coverage.xml

      - name: SonarQube Scan
        # Use full commit SHA for the action to ensure immutability
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectBaseDir=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}